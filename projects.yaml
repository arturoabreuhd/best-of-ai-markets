configuration:
  min_stars: 20
  require_github: True
  max_trending_projects: 10
  markdown_header_file: "config/header.md"
  markdown_footer_file: "config/footer.md"
  projects_history_folder: "history"

categories:
  - category: "crypto-trading"
    title: "Crypto Trading Bots & Frameworks"
    subtitle: "Open-source bots and frameworks for spot, futures, market-making and HFT on crypto venues."
  - category: "backtesting-quant"
    title: "Backtesting & Quant Frameworks"
    subtitle: "Engines and libraries for strategy research, backtesting and systematic / algorithmic trading."
  - category: "market-exchange-data"
    title: "Market & Exchange Data"
    subtitle: "Unified exchange connectors, tick / order-book data, price feeds and technical-analysis libraries."
  - category: "defi-tokenomics"
    title: "DeFi & Tokenomics Analytics"
    subtitle: "Tooling for token unlocks/vesting, supply distribution, decentralization metrics and DeFi research. (Sparse domain — best-available, not exhaustive.)"
  - category: "onchain-analytics"
    title: "On-Chain & Wallet Analytics"
    subtitle: "Querying and analyzing on-chain activity, wallets, flows and DEX data."
  - category: "fundamentals-filings"
    title: "Fundamentals & SEC Filings"
    subtitle: "Access and parse SEC EDGAR filings (10-K/Q, 8-K, Form 3/4/5, 13F) and company fundamentals."
  - category: "macro-geopolitics"
    title: "Macro, Geopolitics & World Intelligence"
    subtitle: "Macro-economic data, geopolitical-risk indices and OSINT / situational-awareness platforms. (Emerging domain — coverage is thin and honestly flagged.)"
  - category: "ai-agents-skills"
    title: "AI Agents, Skills & MCP for Markets"
    subtitle: "LLM agent frameworks, Claude Code / agent skill collections and MCP servers relevant to markets and finance."
  - category: "dashboards-data"
    title: "Dashboards, Terminals & Financial Data"
    subtitle: "Financial data platforms, research terminals and symbol/reference databases."
  - category: "research-discovery"
    title: "Research, Lists & Discovery"
    subtitle: "Curated awesome-lists, learning resources and meta-tooling for finding more tools."

labels:
  - label: "mcp"
    description: "Exposes a Model Context Protocol (MCP) server"
  - label: "skill"
    description: "Claude Code / agent skill collection"
  - label: "awesome"
    description: "Curated awesome-list or resource collection"
  - label: "ai-native"
    description: "LLM / agent-driven by design"
  - label: "self-hosted"
    description: "Designed to be self-hosted"

