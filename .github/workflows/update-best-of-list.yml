# Based on https://github.com/best-of-lists/best-of-update-action/blob/v0.8.5/workflows/update-best-of-list.yml
# Regenerates README.md from projects.yaml every week, opens a PR + draft release.
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for this update"
        required: false
  schedule:
    - cron: "17 14 * * 4" # Every Thursday at 14:17 UTC (off the :00 peak, per GitHub docs)

concurrency:
  group: update-best-of-list
  cancel-in-progress: false

env:
  BRANCH_PREFIX: "update/"
  DEFAULT_BRANCH: "main"

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: ${{ github.event.inputs != null && github.event.inputs.version != null }}
        name: set-version-from-input
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
      - if: ${{ ! (env.VERSION != null && env.VERSION != '') }}
        name: set-version-via-date
        run: echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: check-version-tag
        shell: bash
        run: |
          git fetch --tags --force
          git show-ref --tags --verify --quiet -- "refs/tags/$VERSION" && echo "VERSION=$(date '+%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV" || exit 0
      - name: create-update-branch
        uses: peterjgrainger/action-create-branch@10c7d268152480ae859347db45dc69086cef1d9c # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: "${{ env.BRANCH_PREFIX }}${{ env.VERSION }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_PREFIX }}${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # best-of 0.8.5 is unmaintained since 2022 and GitHub now rejects its
      # `stargazers { totalCount }` GraphQL field, which blanks every project.
      # We run the same generator with a one-field patch (.github/scripts/parche_best_of.py).
      # generar.py feeds it GitHub data fetched in batches: asking one project at a
      # time does not fit GITHUB_TOKEN's 1,000 points/requests per hour with
      # thousands of projects (see the docstring there).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: update-best-of-list
        env:
          GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet best-of==0.8.5
          python .github/scripts/parche_best_of.py
          python .github/scripts/generar.py projects.yaml
      - name: check-generated-data
        # Fail before opening a PR if GitHub data came back empty again.
        run: |
          python - <<'PY'
          import csv, glob, sys
          f = sorted(glob.glob("history/*_projects.csv"))[-1]
          rows = list(csv.DictReader(open(f)))
          ok = sum(1 for r in rows if r.get("star_count"))
          print(f"{f}: {ok}/{len(rows)} projects with GitHub data")
          sys.exit(0 if rows and ok / len(rows) >= 0.9 else 1)
          PY
      - name: push-update
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: ${{ env.BRANCH_PREFIX }}${{ env.VERSION }}
          commit_user_name: best-of update
          commit_user_email: actions@github.com
          commit_message: Update best-of list for version ${{ env.VERSION }}
          tagging_message: ${{ env.VERSION }}
          skip_dirty_check: true
          commit_options: "--allow-empty"
      - name: create-pull-request
        shell: bash
        run: |
          gh pr create -B "${{ env.DEFAULT_BRANCH }}" -H "${{ env.BRANCH_PREFIX }}${{ env.VERSION }}" \
            --title "Best-of update: ${{ env.VERSION }}" \
            --body "To finish this update: merge this PR, then publish the created draft release in the [releases section](../releases)." || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Update: ${{ env.VERSION }}"
          body_path: "latest-changes.md"
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
